<svg xmlns="http://www.w3.org/2000/svg" width="480" height="296">
  <title>暖白积木信纸底板</title>
  <!-- No viewBox: percentage positions resize the frame while studs stay round. -->
  <g id="stationery">
    <defs>
      <linearGradient id="stationery-edge" x2="0" y2="1">
        <stop stop-color="#f5f4ed"/>
        <stop offset=".55" stop-color="#efefe6"/>
        <stop offset="1" stop-color="#e8e9df"/>
      </linearGradient>
      <radialGradient id="stationery-paper" cx=".48" cy=".35" r=".8">
        <stop stop-color="#fcfbf8"/>
        <stop offset=".7" stop-color="#f8f7f3"/>
        <stop offset="1" stop-color="#f2f2ea"/>
      </radialGradient>
      <radialGradient id="stationery-stud-fill" cx=".36" cy=".22" r=".85">
        <stop stop-color="#fbfbf4"/>
        <stop offset=".7" stop-color="#f0f1e7"/>
        <stop offset="1" stop-color="#e2e5d7"/>
      </radialGradient>
      <filter id="stationery-sheet-shadow" x="-5%" y="-5%" width="110%" height="115%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#67705a" flood-opacity=".24"/>
      </filter>
      <filter id="stationery-stud-shadow" x="-70%" y="-60%" width="240%" height="260%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="1" stdDeviation=".55" flood-color="#59644d" flood-opacity=".46"/>
      </filter>
      <g id="stationery-stud">
        <circle cy=".5" r="3.9" fill="#a4ac96" opacity=".24"/>
        <circle r="3.75" fill="url(#stationery-stud-fill)" stroke="#dfe3d3" stroke-width=".45" filter="url(#stationery-stud-shadow)"/>
        <path d="M-3.15-.5a3.2 3.2 0 0 1 5.1-2.1" fill="none" stroke="#fffffa" stroke-width=".65" stroke-linecap="round" opacity=".9"/>
      </g>
      <g id="stationery-stud-row">
        <!-- x = 18px + fraction * (viewport width - 36px). -->
        <use href="#stationery-stud" x="0%" transform="translate(18 0)"/>
        <use href="#stationery-stud" x="4%" transform="translate(16.56 0)"/>
        <use href="#stationery-stud" x="8%" transform="translate(15.12 0)"/>
        <use href="#stationery-stud" x="12%" transform="translate(13.68 0)"/>
        <use href="#stationery-stud" x="16%" transform="translate(12.24 0)"/>
        <use href="#stationery-stud" x="20%" transform="translate(10.8 0)"/>
        <use href="#stationery-stud" x="24%" transform="translate(9.36 0)"/>
        <use href="#stationery-stud" x="28%" transform="translate(7.92 0)"/>
        <use href="#stationery-stud" x="32%" transform="translate(6.48 0)"/>
        <use href="#stationery-stud" x="36%" transform="translate(5.04 0)"/>
        <use href="#stationery-stud" x="40%" transform="translate(3.6 0)"/>
        <use href="#stationery-stud" x="44%" transform="translate(2.16 0)"/>
        <use href="#stationery-stud" x="48%" transform="translate(.72 0)"/>
        <use href="#stationery-stud" x="52%" transform="translate(-.72 0)"/>
        <use href="#stationery-stud" x="56%" transform="translate(-2.16 0)"/>
        <use href="#stationery-stud" x="60%" transform="translate(-3.6 0)"/>
        <use href="#stationery-stud" x="64%" transform="translate(-5.04 0)"/>
        <use href="#stationery-stud" x="68%" transform="translate(-6.48 0)"/>
        <use href="#stationery-stud" x="72%" transform="translate(-7.92 0)"/>
        <use href="#stationery-stud" x="76%" transform="translate(-9.36 0)"/>
        <use href="#stationery-stud" x="80%" transform="translate(-10.8 0)"/>
        <use href="#stationery-stud" x="84%" transform="translate(-12.24 0)"/>
        <use href="#stationery-stud" x="88%" transform="translate(-13.68 0)"/>
        <use href="#stationery-stud" x="92%" transform="translate(-15.12 0)"/>
        <use href="#stationery-stud" x="96%" transform="translate(-16.56 0)"/>
        <use href="#stationery-stud" x="100%" transform="translate(-18 0)"/>
      </g>
      <g id="stationery-stud-column">
        <!-- y = 38px + fraction * (viewport height - 76px). -->
        <use href="#stationery-stud" y="0%" transform="translate(0 38)"/>
        <use href="#stationery-stud" y="9.0909%" transform="translate(0 31.0909)"/>
        <use href="#stationery-stud" y="18.1818%" transform="translate(0 24.1818)"/>
        <use href="#stationery-stud" y="27.2727%" transform="translate(0 17.2727)"/>
        <use href="#stationery-stud" y="36.3636%" transform="translate(0 10.3636)"/>
        <use href="#stationery-stud" y="45.4545%" transform="translate(0 3.4545)"/>
        <use href="#stationery-stud" y="54.5455%" transform="translate(0 -3.4545)"/>
        <use href="#stationery-stud" y="63.6364%" transform="translate(0 -10.3636)"/>
        <use href="#stationery-stud" y="72.7273%" transform="translate(0 -17.2727)"/>
        <use href="#stationery-stud" y="81.8182%" transform="translate(0 -24.1818)"/>
        <use href="#stationery-stud" y="90.9091%" transform="translate(0 -31.0909)"/>
        <use href="#stationery-stud" y="100%" transform="translate(0 -38)"/>
      </g>
    </defs>
    <rect x="7" y="8" rx="10" style="width:calc(100% - 14px);height:calc(100% - 16px)" fill="#b6bca8" filter="url(#stationery-sheet-shadow)"/>
    <rect x="7" y="6" rx="10" style="width:calc(100% - 14px);height:calc(100% - 16px)" fill="url(#stationery-edge)" stroke="#dfe2d3" stroke-width=".6"/>
    <rect x="7.7" y="6.7" rx="9.3" style="width:calc(100% - 15.4px);height:calc(100% - 17.4px)" fill="none" stroke="#fffffa" stroke-opacity=".65" stroke-width=".6"/>
    <rect x="29" y="29" rx="9" style="width:calc(100% - 58px);height:calc(100% - 59px)" fill="url(#stationery-paper)"/>
    <rect x="29" y="29" rx="9" style="width:calc(100% - 58px);height:calc(100% - 59px)" fill="none" stroke="#a8b397" stroke-width="1" stroke-dasharray="3.5 2.8" stroke-linecap="round"/>
    <use href="#stationery-stud-row" y="18"/>
    <use href="#stationery-stud-row" y="100%" transform="translate(0 -20)"/>
    <use href="#stationery-stud-column" x="18"/>
    <use href="#stationery-stud-column" x="100%" transform="translate(-18 0)"/>
  </g>
</svg>
